name: 官网 Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/check-site.mjs"
      - "src/yanfield/app/globals.css"
      - "docs/screenshots/**"
      - "icon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Pages must already be enabled with "GitHub Actions" as its source; see docs/en/website.md.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build-site.mjs
      - run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
