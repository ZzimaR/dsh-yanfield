name: 🐛 Bug report
description: Report a reproducible problem so we can find it faster (中文提交也欢迎)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please include environment, reproduction steps, and the full error text. "It broke" is hard to act on.
        Remove API keys, manuscript text, and personal paths before submitting.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: "One or two sentences: what went wrong, and what were you trying to do?"
      placeholder: The title field in the New book dialog has no visible border, so it is unclear that it can be typed into.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from opening DSH and go step by step. Note how often it happens if it is intermittent.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The field should have a 1px border that stays visible in dark mode.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Paste the full error text rather than half a line from a screenshot.
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error text / logs
      description: Red error in the panel, DSH console output, or logs under `%USERPROFILE%\.dsh\profiles\<profile>\`.
      render: text
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Installation
      options:
        - DSH Desktop app (DeepSeek Harness)
        - DSH Web (`dsh web`)
        - yanfield-dev profile (local source link)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Settings → About, or the version on the start page.
      placeholder: 0.2.x
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Yanfield version / build time
      description: Yanfield → Settings → About → the "Build" line, or `version` in `package.json`.
      placeholder: "2026-11-12T11:59:00Z"
    validations:
      required: true

  - type: dropdown
    id: model-route
    attributes:
      label: Model route (required for AI issues)
      description: Settings → Model services, on the DeepSeek Harness card.
      options:
        - DeepSeek account sign-in (uses the account already signed in to DSH)
        - Official DeepSeek API key
        - Offline demo mode
        - Not configured / not sure
        - Not AI-related
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: deepseek-flash / deepseek-v4-pro
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recording (optional)
      description: Drag images in. Make sure the interface and the error are readable.
    validations:
      required: false

  - type: checkboxes
    id: tried
    attributes:
      label: What you already tried
      options:
        - label: Quit DSH completely and reopened it (not just a page refresh)
        - label: Reinstalled the latest build (`node scripts/reinstall.mjs`)
        - label: Checked docs/faq.md and searched existing issues
        - label: Tried another model, or reproduced in a blank novel
        - label: None of the above

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, manuscript text, and personal paths
          required: true
