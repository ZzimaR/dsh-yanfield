name: ✨ Feature request
description: Suggest a feature, improvement, or product idea (中文提交也欢迎)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the step where you get stuck, then describe the interaction you want. That is easier to evaluate than "add a button".

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Which writing workflow feels awkward? How do you work around it today?
      placeholder: In book two the character relationships shift a lot, and AI continuation still writes states that no longer exist.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: How should Yanfield behave? Describe the interaction; it does not have to be a technical design.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Manual context, another tool, or just living with it — all help us judge priority.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Writing desk (prose editing / review / formatting)
        - Story and chapter outlines
        - Characters / world / foreshadowing / archives
        - AI assistant (chat / revisions / task cards)
        - Library and overview
        - Settings (models / prompts / appearance / data)
        - Import and export
        - Installation, builds, and compatibility
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: ai-cost
    attributes:
      label: Does this affect AI cost?
      description: If the idea adds model calls, roughly how many, and is it worth it?
      placeholder: Diff locally before review, and call the model once after confirmation.
    validations:
      required: false

  - type: dropdown
    id: pr
    attributes:
      label: Would you submit a PR?
      options:
        - Yes (I will outline the approach following docs/development.md first)
        - Feedback only
        - Not sure
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > New dependencies, storage changes, and AI protocol changes should be discussed in an issue first, so a PR does not go to waste.
        > See the [roadmap](https://github.com/ZzimaR/dsh-yanfield#roadmap) before filing.
